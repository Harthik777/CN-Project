name: Verify project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-api.txt
      - run: python -m pip install dpkt==1.9.8
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/export_browser_model.py --check
      - run: python scripts/verify_browser_packets.py
      - name: Verify networking lab over a real HTTP socket
        shell: bash
        run: |
          mkdir -p output
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 7860 --workers 1 --no-access-log > output/lab-server.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:7860/api/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/network_lab.py --url http://127.0.0.1:7860 --repetitions 1 --batch-sizes 42 168 --output output/ci-network-lab.json
          python scripts/packet_lab.py --url http://127.0.0.1:7860 --output output/ci-packet-lab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-lab-evidence
          path: |
            output/ci-network-lab.*
            output/lab-server.log
            output/ci-packet-lab.json
            output/browser-parity/results.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
